appId: dev.hiyas.jewelry
name: piece-and-order
---
- launchApp
# Create an on-hand ring, stepping through the editor (metal defaults to 18K yellow gold).
- tapOn: "Pieces"
- tapOn:
    id: "quick-add"
- tapOn:
    id: "quick-add-piece"
- tapOn:
    id: "type-ring"
- tapOn:
    id: "next-step" # metal
- tapOn:
    id: "next-step" # sizes
- tapOn:
    id: "next-step" # stones
- tapOn:
    id: "next-step" # costs
- tapOn:
    id: "add-cost-labor"
- tapOn:
    id: "cost-amount-0"
- inputText: "1500"
- hideKeyboard
- tapOn:
    id: "next-step" # finish: the description is suggested from the choices
- assertVisible: "18K yellow gold ring"
- tapOn:
    id: "piece-description"
- eraseText: 40
- inputText: "Solitaire engagement ring"
- hideKeyboard
- tapOn:
    id: "save-piece"
- assertVisible: "Solitaire engagement ring"

# Sell it in a job order to the client from the previous flow.
- tapOn: "Orders"
- tapOn:
    id: "quick-add"
- tapOn:
    id: "quick-add-order"
- tapOn:
    id: "order-client"
- tapOn: "Ana Santos"
- tapOn:
    id: "add-existing-piece"
- tapOn: "Solitaire engagement ring"
- tapOn:
    id: "item-price"
- eraseText: 12
- inputText: "25000"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "save-order"
- tapOn:
    id: "save-order"

# Order detail: record a down payment, then the balance.
- assertVisible:
    id: "order-detail"
- assertVisible: "₱25,000.00"
- tapOn:
    id: "add-payment"
- tapOn:
    id: "payment-amount"
- eraseText: 12
- inputText: "10000"
- hideKeyboard
- tapOn:
    id: "save-payment"
- assertVisible: "₱15,000.00"
- tapOn:
    id: "add-payment"
# The amount defaults to the remaining balance.
- tapOn:
    id: "save-payment"
- assertVisible: "Fully paid"

# The list shows available pieces by default, so the sold piece moves to "In an order".
- back
- tapOn: "Pieces"
- assertNotVisible: "Solitaire engagement ring"
- tapOn:
    id: "toggle-filters"
- tapOn: "In an order"
- assertVisible: "Solitaire engagement ring"
