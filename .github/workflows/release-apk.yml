name: Release APK

# Builds an installable Android APK connected to the deployed backend and
# attaches it to a GitHub release. Triggered by pushing a tag like v1.2.0.
#
# Repository variables (from the CDK stack outputs):
#   EXPO_PUBLIC_API_URL, EXPO_PUBLIC_AWS_REGION, EXPO_PUBLIC_USER_POOL_CLIENT_ID
# Optional secrets for a stable signing key (otherwise the debug key is used):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Generate native project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: mobile/android
        run: |
          echo "$KEYSTORE" | base64 -d > app/release.keystore
          cat >> gradle.properties <<EOF
          android.injected.signing.store.file=$PWD/app/release.keystore
          android.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }}
          android.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_AWS_REGION: ${{ vars.EXPO_PUBLIC_AWS_REGION }}
          EXPO_PUBLIC_USER_POOL_CLIENT_ID: ${{ vars.EXPO_PUBLIC_USER_POOL_CLIENT_ID }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hiyas-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "hiyas-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "hiyas-${GITHUB_REF_NAME}.apk" --clobber
